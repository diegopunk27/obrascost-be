name: Keep Render Services Alive

# Render free tier suspende los servicios tras 15 minutos de inactividad y
# devuelve 502/503 al primer request mientras hace cold start (~30-50s). Para
# la evaluación académica del trabajo final, mantenemos ambos servicios
# calientes con un ping periódico desde GitHub Actions.
#
# Esto NO es una práctica de producción (consume recursos del free tier de
# forma artificial). Es una solución pragmática para garantizar que el
# profesor pueda probar la app sin esperas durante el período de evaluación.

on:
  schedule:
    # Cada 10 minutos. El sleep de Render es a los 15 — margen seguro.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (FastAPI)
        run: |
          echo "Pinging BE..."
          curl -fsS -m 90 https://obrascost-be.onrender.com/health \
            -w "\nHTTP %{http_code} in %{time_total}s\n" \
            || echo "BE ping failed (no falla el job)"

      - name: Ping multi-agente (Bun + Hono)
        run: |
          echo "Pinging multi-agente con payload mínimo..."
          curl -fsS -m 90 -X POST \
            https://obrascost-ai-api.onrender.com/estimacion-obra \
            -H "Content-Type: application/json" \
            -d '{
              "nombre_obra": "keep-alive-ping",
              "superficie_m2": 1.0,
              "provincia_id": null,
              "estimacion_heuristica": {
                "total_estimado": 1.0,
                "desglose_por_rubro": {"x": 1.0},
                "margen_error_pct": 0.0
              }
            }' \
            -w "\nHTTP %{http_code} in %{time_total}s\n" \
            -o /dev/null \
            || echo "AI ping failed (no falla el job)"
